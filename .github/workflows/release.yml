name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64
            interpreters: 3.8 3.9 3.10 3.11 3.12 3.13 3.14 3.13t 3.14t pypy3.9 pypy3.10 pypy3.11
          # Linux aarch64
          - os: ubuntu-latest
            target: aarch64
            interpreters: 3.8 3.9 3.10 3.11 3.12 3.13 3.14 3.13t 3.14t pypy3.9 pypy3.10 pypy3.11
          # macOS universal2 (x86_64 + arm64 fat binary)
          - os: macos-latest
            target: universal2-apple-darwin
            interpreters: 3.10 3.11 3.12 3.13 3.14
          # Windows x86_64
          - os: windows-latest
            target: x64
            interpreters: 3.10 3.11 3.12 3.13 3.14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Interpreters are listed explicitly: pyo3 0.25 supports up to 3.14,
          # so --find-interpreter fails once runners ship a newer Python.
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.interpreters }}
          sccache: "true"
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  publish:
    needs: [build-sdist, build-wheels]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
