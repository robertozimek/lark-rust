name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    name: build-wheels (${{ matrix.platform.target }}, ${{ matrix.label || matrix.python }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      # One interpreter per job so builds run in parallel.
      # Interpreters are listed explicitly: pyo3 0.25 supports up to 3.14,
      # so --find-interpreter fails once runners ship a newer Python.
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          # macOS universal2 (x86_64 + arm64 fat binary)
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x64 }
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Extra Linux-only interpreters
          - platform: { os: ubuntu-latest, target: x86_64 }
            python: 3.8 3.9 3.14t pypy3.9 pypy3.10 pypy3.11
            label: extras
          - platform: { os: ubuntu-latest, target: aarch64 }
            python: 3.8 3.9 3.14t pypy3.9 pypy3.10 pypy3.11
            label: extras
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ matrix.python }}
          sccache: "true"
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}-${{ matrix.label || matrix.python }}
          path: dist/*.whl

  publish:
    needs: [build-sdist, build-wheels]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
